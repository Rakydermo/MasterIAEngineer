[project]
name = "estimador-cag"
version = "0.1.0"
description = "AI-powered software estimation service using Cache Augmented Generation architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.54.0",
    "litellm==1.111.0",
    "openai>=2.20",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]